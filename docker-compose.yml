services:
  devcapsule:
    image: ghcr.io/wjw1-evan/opencode-cloud:latest
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  pgdata:
