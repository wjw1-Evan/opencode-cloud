services:
  devcapsule:
    image: ghcr.io/wjw1-evan/opencode-cloud:latest
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devcapsule}
      # Set COOKIE_SECURE=1 when this service is exposed over HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - user-net

volumes:
  pgdata:

networks:
  user-net:
    name: devcapsule_user-net
