services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: devcapsule
      POSTGRES_PASSWORD: devcapsule
      POSTGRES_DB: devcapsule
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devcapsule"]
      interval: 3s
      timeout: 3s
      retries: 15
    networks:
      - app-net

  api:
    build: ./backend
    image: devcapsule/api:1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADDR: ":8080"
      DATABASE_URL: postgres://devcapsule:devcapsule@postgres:5432/devcapsule?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      NETWORK_NAME: ${NETWORK_NAME:-devcapsule_user-net}
      IDLE_TIMEOUT_MIN: ${IDLE_TIMEOUT_MIN:-30}
      BATCH_CONCURRENCY: ${BATCH_CONCURRENCY:-5}
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - app-net
      # api must be attached to user-net so the proxy can reach student
      # containers by name (create it first: docker network create devcapsule_user-net)
      - user-net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - app-net

networks:
  app-net:
  user-net:
    name: ${NETWORK_NAME:-devcapsule_user-net}
    external: true

volumes:
  pgdata:
