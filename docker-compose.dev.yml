services:
  devcapsule:
    build: ./backend
    image: devcapsule:dev
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      JWT_SECRET: dev-secret
    volumes:
      - pgdata:/var/lib/postgresql/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - user-net

volumes:
  pgdata:

networks:
  user-net:
    name: devcapsule_user-net
